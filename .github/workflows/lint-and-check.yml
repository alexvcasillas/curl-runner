name: Lint and Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to checkout'
        required: true
        type: string

# A new push to a pull request cancels its previous run. Pushes to main,
# manual runs and other triggers each get their own group, so they never wait
# on or cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-check:
    name: Lint and Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          # Node and the store cache come from actions/setup-node; the job runs
          # `pnpm install --frozen-lockfile` itself.
          install: false
          node-version-file: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Check
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Biome Check
        run: pnpm check:ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Docs Tests
        run: pnpm --filter @curl-runner/docs test
