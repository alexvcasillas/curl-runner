name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      smoke:
        description: "Build all release artifacts and smoke-test them WITHOUT publishing (skips the changesets release)"
        type: boolean
        default: false
      studio_tag:
        description: "Rebuild, sign and re-upload only the studio dmg for this existing release tag (e.g. @curl-runner/cli@2.3.0). The tag must already contain the studio packaging (scripts/studio-dmg.sh). Everything else is skipped."
        type: string
        default: ""

# Flow: meta -> build (matrix) -> release (changesets: version PR, or publish
# the five @curl-runner/cli-<platform> npm packages with the built binaries,
# then @curl-runner/cli) -> package -> upload (GitHub Release assets).
# Binaries are built only when a publish is due (no pending changesets and the
# version is not on npm yet) or for smoke runs. If a job fails after npm
# publishing, re-run the failed jobs: scripts/npm-publish.sh skips versions
# already on npm, and changeset publish does the same.
# After upload, the studio job signs, notarizes and attaches the macOS dmg.
# It never blocks the CLI release; if it fails, re-run it or dispatch with
# studio_tag set to the release tag. Smoke runs also sign and notarize the
# studio, and keep the dmg as a workflow artifact instead of attaching it.
permissions:
  contents: read

# Dispatches that don't publish (smoke, studio_tag) get their own group, so
# they never replace a pending release run on main.
concurrency: ${{ github.workflow }}-${{ github.ref }}${{ inputs.smoke && '-smoke' || '' }}${{ inputs.studio_tag && format('-studio-{0}', inputs.studio_tag) || '' }}

jobs:
  meta:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      TAG: ${{ steps.meta.outputs.TAG }}
      VERSION: ${{ steps.meta.outputs.VERSION }}
      FILE_PREFIX: ${{ steps.meta.outputs.FILE_PREFIX }}
      BUILD: ${{ steps.meta.outputs.BUILD }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Compute release tag + build metadata for CLI
        id: meta
        env:
          SMOKE: ${{ inputs.smoke }}
          STUDIO_TAG: ${{ inputs.studio_tag }}
        run: |
          VERSION=$(jq -r .version packages/cli/package.json)
          pending=$(find .changeset -name '*.md' ! -name README.md | wc -l)
          if [ -n "$STUDIO_TAG" ]; then
            # Studio-only run: BUILD=false skips build, package and upload;
            # release and the smoke jobs check studio_tag themselves.
            if [ "$SMOKE" = "true" ]; then
              echo "::error::smoke and studio_tag can't be combined"; exit 1
            fi
            case "$STUDIO_TAG" in
              @curl-runner/cli@?*) VERSION=${STUDIO_TAG#@curl-runner/cli@} ;;
              *) echo "::error::studio_tag must look like @curl-runner/cli@<version>"; exit 1 ;;
            esac
            git fetch --quiet --depth=1 origin "refs/tags/$STUDIO_TAG:refs/tags/$STUDIO_TAG" || {
              echo "::error::tag $STUDIO_TAG not found"; exit 1
            }
            git cat-file -e "refs/tags/$STUDIO_TAG:scripts/studio-dmg.sh" 2>/dev/null || {
              echo "::error::$STUDIO_TAG predates the studio packaging (no scripts/studio-dmg.sh); studio_tag only rebuilds releases that ship the studio"; exit 1
            }
            BUILD=false
          elif [ "$SMOKE" = "true" ]; then
            BUILD=true
          elif [ "$pending" -gt 0 ]; then
            BUILD=false  # changesets opens/updates the version PR; nothing to publish
          else
            # 0 published, 1 not published, 2 lookup failed: fail the run
            # rather than guess (a wrong "published" would skip the release).
            status=0
            scripts/npm-published.sh @curl-runner/cli "$VERSION" || status=$?
            case "$status" in
              0) BUILD=false ;;  # already published
              1) BUILD=true ;;
              *) echo "::error::npm lookup for @curl-runner/cli@$VERSION failed"; exit 1 ;;
            esac
          fi
          {
            echo "TAG=@curl-runner/cli@${VERSION}"
            echo "VERSION=$VERSION"
            echo "FILE_PREFIX=curl-runner-cli-${VERSION}"
            echo "BUILD=$BUILD"
          } >> "$GITHUB_OUTPUT"
          echo "version=$VERSION pending_changesets=$pending build=$BUILD"

  release:
    name: Release
    needs: [meta, build]
    if: ${{ !inputs.smoke && !inputs.studio_tag && !cancelled() && needs.meta.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    environment:
      name: Production
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          # Node and the store cache come from actions/setup-node; the job runs
          # `pnpm install --frozen-lockfile` itself.
          install: false
          node-version-file: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install latest npm
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download binaries
        if: ${{ needs.build.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: dist-bin
          merge-multiple: true

      # Publishes the platform packages (version stamped from packages/cli),
      # then `changeset publish`. See packages/cli/README.md.
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm run version
          publish-script: bash scripts/npm-publish.sh dist-bin
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NPM_CONFIG_PROVENANCE: true
          PNPM_CONFIG_PROVENANCE: true

      # crates.io trusted publishing (OIDC token), then curl-runner-cloud-proto, curl-runner-core and
      # curl-runner at the version the version PR synced into Cargo.toml.
      - name: Install Rust toolchain
        if: ${{ steps.changesets.outputs.published == 'true' }}
        run: rustup show active-toolchain || rustup toolchain install

      - name: Authenticate to crates.io
        if: ${{ steps.changesets.outputs.published == 'true' }}
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crates
        if: ${{ steps.changesets.outputs.published == 'true' }}
        run: scripts/crates-publish.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

  build:
    name: Build ${{ matrix.platform }}
    needs: meta
    if: ${{ needs.meta.outputs.BUILD == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            exe: ""
          # Native arm64 runner instead of `cross`: the musl-tools toolchain used
          # for linux-x64 works unchanged and no Docker-in-Docker is needed.
          - platform: linux-arm64
            target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            exe: ""
          # Cross-compiled from the arm64 runner (macos-13 is retired).
          - platform: darwin-x64
            target: x86_64-apple-darwin
            os: macos-latest
            exe: ""
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            os: macos-latest
            exe: ""
          - platform: windows-x64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            exe: ".exe"
    env:
      CURL_RUNNER_VERSION: ${{ needs.meta.outputs.VERSION }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      # aws-lc-sys (rustls crypto) needs a C toolchain + cmake; musl needs musl-gcc.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools cmake clang build-essential pkg-config

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install nasm -y --no-progress
          echo "C:/Program Files/NASM" >> "$GITHUB_PATH"

      - name: Install Rust target
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Rust binary
        shell: bash
        env:
          # Windows: link the CRT statically so users need no VC++ redistributable.
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
        run: cargo build --release --locked -p curl-runner --target ${{ matrix.target }}

      - name: Stage binary as curl-runner-${{ matrix.platform }}
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/curl-runner${{ matrix.exe }}" \
             "dist/curl-runner-${{ matrix.platform }}${{ matrix.exe }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.platform }}
          path: dist/curl-runner-${{ matrix.platform }}${{ matrix.exe }}
          if-no-files-found: error

  package:
    name: Package archives + checksums
    needs: [meta, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      FILE_PREFIX: ${{ needs.meta.outputs.FILE_PREFIX }}
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: packages/cli
          merge-multiple: true

      - name: Package binaries
        run: |
          cd packages/cli
          chmod +x curl-runner-linux-* curl-runner-darwin-*
          tar -czf "${FILE_PREFIX}-linux-x64.tar.gz"    curl-runner-linux-x64
          tar -czf "${FILE_PREFIX}-linux-arm64.tar.gz"  curl-runner-linux-arm64
          tar -czf "${FILE_PREFIX}-darwin-x64.tar.gz"   curl-runner-darwin-x64
          tar -czf "${FILE_PREFIX}-darwin-arm64.tar.gz" curl-runner-darwin-arm64
          zip        "${FILE_PREFIX}-windows-x64.zip"   curl-runner-windows-x64.exe

      - name: Generate checksums
        run: |
          cd packages/cli
          shasum -a 256 \
            "${FILE_PREFIX}-linux-x64.tar.gz" \
            "${FILE_PREFIX}-linux-arm64.tar.gz" \
            "${FILE_PREFIX}-darwin-x64.tar.gz" \
            "${FILE_PREFIX}-darwin-arm64.tar.gz" \
            "${FILE_PREFIX}-windows-x64.zip" \
            > SHA256SUMS.txt

      - name: Upload release assets artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            packages/cli/${{ needs.meta.outputs.FILE_PREFIX }}-*.tar.gz
            packages/cli/${{ needs.meta.outputs.FILE_PREFIX }}-*.zip
            packages/cli/SHA256SUMS.txt
          if-no-files-found: error

  upload:
    name: Upload to GitHub Release
    needs: [release, meta, package]
    if: ${{ needs.release.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: Production
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: packages/cli

      - name: Upload binaries + checksums to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.TAG }}
          files: |
            packages/cli/${{ needs.meta.outputs.FILE_PREFIX }}-linux-x64.tar.gz
            packages/cli/${{ needs.meta.outputs.FILE_PREFIX }}-linux-arm64.tar.gz
            packages/cli/${{ needs.meta.outputs.FILE_PREFIX }}-darwin-x64.tar.gz
            packages/cli/${{ needs.meta.outputs.FILE_PREFIX }}-darwin-arm64.tar.gz
            packages/cli/${{ needs.meta.outputs.FILE_PREFIX }}-windows-x64.zip
            packages/cli/SHA256SUMS.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # macOS app: universal bundle, signed with the hardened runtime, packed into
  # a dmg, notarized, stapled and attached to the release. Runs after the CLI
  # is uploaded (or alone, with studio_tag) so it can never hold the CLI back.
  # On smoke runs it does the same from the workflow's ref and keeps the dmg
  # as a workflow artifact; nothing depends on it.
  # The signing identity is found in the imported certificate at run time.
  studio:
    name: Studio dmg
    needs: [meta, upload]
    if: ${{ !cancelled() && needs.meta.result == 'success' && (inputs.studio_tag != '' || inputs.smoke || (needs.meta.outputs.BUILD == 'true' && needs.upload.result == 'success')) }}
    runs-on: macos-latest
    environment:
      name: Production
    permissions:
      contents: write
    defaults:
      run:
        shell: bash  # -eo pipefail
    env:
      TAG: ${{ needs.meta.outputs.TAG }}
      VERSION: ${{ needs.meta.outputs.VERSION }}
      APP: target/studio/curl-runner studio.app
      ENTITLEMENTS: crates/curl-runner-studio/entitlements.plist
    steps:
      - name: Check signing secrets
        env:
          STUDIO_CERT_P12_BASE64: ${{ secrets.STUDIO_CERT_P12_BASE64 }}
          STUDIO_CERT_PASSWORD: ${{ secrets.STUDIO_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          missing=()
          for name in STUDIO_CERT_P12_BASE64 STUDIO_CERT_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::missing signing secrets: ${missing[*]}. Add them to the repository (or the Production environment) to sign the studio."
            exit 1
          fi
          {
            echo "KEYCHAIN=$RUNNER_TEMP/studio-signing.keychain-db"
            echo "NOTARY_KEY=$RUNNER_TEMP/studio-notary-key.p8"
          } >> "$GITHUB_ENV"

      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.studio_tag != '' && format('refs/tags/{0}', inputs.studio_tag) || github.sha }}

      - name: Check release and version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMOKE: ${{ inputs.smoke }}
        run: |
          cargo_version=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          if [ "$SMOKE" = "true" ]; then
            # Dry run: no release to check; the dmg takes the workspace version.
            echo "VERSION=$cargo_version" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$cargo_version" != "$VERSION" ]; then
            echo "::error::Cargo.toml is at $cargo_version but the release is $VERSION"
            exit 1
          fi
          gh release view "$TAG" --json tagName >/dev/null || {
            echo "::error::no GitHub release for $TAG"
            exit 1
          }

      - name: Install Rust targets
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: studio-universal

      - name: Import signing certificate
        env:
          STUDIO_CERT_P12_BASE64: ${{ secrets.STUDIO_CERT_P12_BASE64 }}
          STUDIO_CERT_PASSWORD: ${{ secrets.STUDIO_CERT_PASSWORD }}
        run: |
          umask 077
          cert="$RUNNER_TEMP/studio-cert.p12"
          keychain_password=$(openssl rand -base64 32)
          printf '%s' "$STUDIO_CERT_P12_BASE64" | base64 --decode > "$cert"
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"
          security import "$cert" -k "$KEYCHAIN" -f pkcs12 -P "$STUDIO_CERT_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$cert"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$KEYCHAIN" >/dev/null
          # Prepend to the search list so codesign finds the identity.
          existing=()
          while IFS= read -r k; do
            k=${k#"${k%%[![:space:]]*}"}; k=${k//\"/}
            [ -n "$k" ] && existing+=("$k")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN" "${existing[@]}"
          # The SHA-1 of the first Developer ID Application identity, so no
          # name or team id is printed or kept anywhere.
          identity=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/"Developer ID Application: / { print $2; exit }')
          if [ -z "$identity" ]; then
            echo "::error::STUDIO_CERT_P12_BASE64 holds no valid Developer ID Application identity"
            exit 1
          fi
          echo "IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build universal app bundle
        run: scripts/studio-bundle.sh --release --universal

      - name: Sign app
        run: |
          codesign --force --options runtime --timestamp \
            --entitlements "$ENTITLEMENTS" --sign "$IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Build and sign dmg
        run: |
          DMG="$RUNNER_TEMP/curl-runner-studio-$VERSION.dmg"
          scripts/studio-dmg.sh "$APP" "$DMG"
          codesign --force --timestamp --sign "$IDENTITY" "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Notarize and staple dmg
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          umask 077
          trap 'rm -f "$NOTARY_KEY"' EXIT
          printf '%s\n' "$APPLE_API_KEY_P8" > "$NOTARY_KEY"
          auth=(--key "$NOTARY_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          result="$RUNNER_TEMP/notary.json"
          xcrun notarytool submit "$DMG" "${auth[@]}" --wait --output-format json > "$result" || true
          status=$(jq -r '.status // empty' "$result" 2>/dev/null || true)
          id=$(jq -r '.id // empty' "$result" 2>/dev/null || true)
          echo "notarization ${id:-(no id)}: ${status:-(no status)}"
          if [ "$status" != "Accepted" ]; then
            [ -n "$id" ] && { xcrun notarytool log "$id" "${auth[@]}" || true; }
            echo "::error::notarization failed (status: ${status:-submit error})"
            exit 1
          fi
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl -a -t open --context context:primary-signature -v "$DMG"

      - name: Upload dmg to GitHub Release
        if: ${{ !inputs.smoke }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "$DMG" --clobber

      - name: Keep dmg as a workflow artifact (smoke)
        if: ${{ inputs.smoke }}
        uses: actions/upload-artifact@v7
        with:
          name: studio-dmg
          path: ${{ env.DMG }}
          if-no-files-found: error

      - name: Remove signing keychain and key
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then
            security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/studio-notary-key.p8" "$RUNNER_TEMP/studio-cert.p12"

  # Manual only (smoke=true): packages both crates and builds them from the
  # packaged sources, as crates.io and `cargo install` will. Never uploads.
  crates-smoke:
    name: crates.io dry run
    needs: meta
    if: ${{ inputs.smoke }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang build-essential pkg-config

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: cargo publish --dry-run
        run: cargo publish --workspace --dry-run --locked

  # Manual only (workflow_dispatch with smoke=true): never publishes.
  release-smoke:
    name: Smoke (${{ matrix.name }})
    needs: [meta, package]
    if: ${{ inputs.smoke && !cancelled() && needs.package.result == 'success' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64 / bookworm-slim
            os: ubuntu-latest
            platform: linux-x64
          - name: linux-arm64 / bookworm-slim
            os: ubuntu-24.04-arm
            platform: linux-arm64
          - name: windows-x64
            os: windows-latest
            platform: windows-x64
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: assets

      - name: Verify checksums
        if: runner.os == 'Linux'
        run: cd assets && grep "${{ matrix.platform }}" SHA256SUMS.txt | sha256sum -c -

      - name: Install + run on pristine bookworm-slim
        if: runner.os == 'Linux'
        run: .github/scripts/release-smoke-linux.sh assets "${{ needs.meta.outputs.VERSION }}" "${{ matrix.platform }}"

      # Runs the real install.ps1. Downloads are stubbed (functions shadow the
      # cmdlets) to serve the locally built assets, like the Linux curl shim.
      - name: Run install.ps1 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = "${{ needs.meta.outputs.VERSION }}"
          $assets = (Resolve-Path assets).Path
          $env:CURL_RUNNER_INSTALL_DIR = Join-Path $PWD "installed"
          function Invoke-RestMethod { param($Uri, [switch]$UseBasicParsing) [pscustomobject]@{ tag_name = "@curl-runner/cli@$v" } }
          function Invoke-WebRequest { param($Uri, $OutFile, [switch]$UseBasicParsing) Copy-Item (Join-Path $assets ($Uri -split '/')[-1]) $OutFile }
          & packages/docs/public/install.ps1
          $exe = Join-Path $env:CURL_RUNNER_INSTALL_DIR "curl-runner.exe"
          if (-not (Test-Path $exe)) { throw "curl-runner.exe not installed" }
          $out = & $exe --version
          Write-Host $out
          if ($out -notmatch [regex]::Escape($v)) { throw "version mismatch" }
          Set-Content -Path gh.yaml -Value "request:`n  name: github`n  url: https://api.github.com/zen`n  method: GET`n  headers:`n    User-Agent: curl-runner-release-smoke"
          & $exe gh.yaml
          if ($LASTEXITCODE -ne 0) { throw "https request failed" }

  # Manual only (smoke=true): npm packaging end to end against a local
  # verdaccio (bun without node, npm without bun, pnpm). Never publishes.
  npm-smoke:
    name: npm smoke (${{ matrix.platform }})
    needs: [meta, build]
    if: ${{ inputs.smoke && !cancelled() && needs.build.result == 'success' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
          - platform: linux-arm64
            os: ubuntu-24.04-arm
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: bin-${{ matrix.platform }}
          path: dist-bin

      - name: Install + run from npm tarballs (bun, npm, pnpm)
        run: scripts/npm-smoke.sh dist-bin
