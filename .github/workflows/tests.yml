name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_run:
    workflows: ["Vercel Production Deployment"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to checkout'
        required: true
        type: string

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --no-fail-fast

      # The website's feature examples must pass `curl-runner validate --strict`.
      - name: Build CLI for docs examples
        if: runner.os == 'Linux'
        run: cargo build -p curl-runner

      - name: Setup pnpm
        if: runner.os == 'Linux'
        uses: pnpm/setup@v3
        with:
          # Node and the store cache come from actions/setup-node; the job runs
          # `pnpm install --frozen-lockfile` itself.
          install: false
          node-version-file: false

      - name: Setup Node
        if: runner.os == 'Linux'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install Dependencies
        if: runner.os == 'Linux'
        run: pnpm install --frozen-lockfile

      - name: Validate docs examples
        if: runner.os == 'Linux'
        run: CURL_RUNNER_BIN=$PWD/target/debug/curl-runner pnpm --filter @curl-runner/docs test examples

  rust-musl:
    name: Rust musl build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Smoke test
        run: ./target/x86_64-unknown-linux-musl/release/curl-runner --version
