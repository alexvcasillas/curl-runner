[package]
name = "curl-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Run HTTP request suites defined in YAML: validation, retries, parallel runs, snapshots and diffs, on libcurl"
readme = "README.md"
keywords = ["http", "curl", "api-testing", "yaml", "cli"]
categories = ["command-line-utilities", "development-tools::testing", "web-programming::http-client"]

[[bin]]
name = "curl-runner"
path = "src/main.rs"

[dependencies]
curl-runner-core.workspace = true
thiserror = "2.0.21"
curl = { version = "0.4", default-features = false, features = ["static-curl", "http2", "rustls"] }
ctrlc = "3.5.2"
globset = "0.4.21"
serde = "1.0.229"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
indexmap = "2.14.2"
regex = "1.13.1"
notify = "8"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
cliclack = "0.5.6"
url = "2"
flate2 = "1.1.10"
tar = "0.4.46"
sha2 = "0.11.1"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[features]
# Honor the CURL_RUNNER_TEST_* URL overrides in release builds (always on in debug builds).
test-hooks = []

[dev-dependencies]
assert_cmd = "2.2.2"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"
testkit = { path = "../testkit" }

[target."cfg(unix)".dependencies]
signal-hook = "0.3"
