[package]
name = "curl-runner-studio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "curl-runner studio: a macOS desktop app for YAML request suites"
publish = false

[[bin]]
name = "curl-runner-studio"
path = "src/main.rs"

[dependencies]
curl-runner-core.workspace = true
serde_json = "1.0.154"

[target.'cfg(target_os = "macos")'.dependencies]
futures = "0.3.34"
gpui-kit = { version = "=0.8.1", features = ["tree-sitter-yaml"] }
# gpui-kit 0.8.1 pins this exact GPUI; keep both in step when upgrading.
gpui-pre = "=0.3.10"
log = "0.4.34"
# The editor's provider traits speak LSP types; the Kit does not re-export them.
lsp-types = { version = "0.97.0", features = ["proposed"] }
notify = "8"

[dev-dependencies]
tempfile = "3.27.0"


# `test-support` for the GPUI smoke tests (`#[gpui_kit::test]`, element queries).
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-kit = { version = "=0.8.1", features = ["tree-sitter-yaml", "test-support"] }
