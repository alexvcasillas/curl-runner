[package]
name = "curl-runner-cloud-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Wire protocol shared by the curl-runner Cloud server, CLI and studio"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
uuid = { version = "1.29.0", features = ["serde"] }
