[package]
name = "curl-runner-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Integration tests in tests/*.rs that need Postgres (DATABASE_URL).
db-tests = []

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
curl-runner-cloud-proto.workspace = true
# TLS for OAuth (reqwest) and SMTP (lettre) is rustls on ring, never aws-lc-rs,
# so the static musl image cross-compiles with zig alone.
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
rand = "0.9.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
# Runtime queries only (no compile-time `query!`): builds have no database.
# No TLS: Postgres is reached on the private compose network.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "chrono", "uuid", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "io-util", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
