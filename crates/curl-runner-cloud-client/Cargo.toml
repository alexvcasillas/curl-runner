[package]
name = "curl-runner-cloud-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Blocking client for the curl-runner Cloud API, shared by the CLI and the studio"

[dependencies]
curl-runner-core.workspace = true
curl-runner-cloud-proto.workspace = true
curl = { version = "0.4", default-features = false, features = ["static-curl", "http2", "rustls"] }
flate2 = "1.1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2"
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }

[dev-dependencies]
tempfile = "3.27.0"
testkit = { path = "../testkit" }
