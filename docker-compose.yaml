# Runs the curl-runner server and the Cloud dashboard from their prebuilt images
# on GHCR, with Postgres. Coolify deploys this file; the images are built by
# .github/workflows/server.yml and .github/workflows/cloud.yml.
# Without Coolify, create the network first with `docker network create coolify`
# or remove the `coolify` entries below. Postgres sits only on the private
# `internal` network.
#
# Required: POSTGRES_PASSWORD, SECRET_KEY (32+ bytes), PUBLIC_API_URL and
# PUBLIC_APP_URL. Everything else is optional; an unset value falls back to the
# server's default.
services:
  server:
    image: ghcr.io/alexvcasillas/curl-runner-server:${SERVER_IMAGE_TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: ${PORT:-8080}
      RUST_LOG: ${RUST_LOG:-info}
      # Postgres parts, not a URL, so the password needs no escaping.
      # A distinctive alias on the private network, so no other stack's `db`
      # on the shared coolify network can answer.
      DB_HOST: curl-runner-db
      DB_USER: curl_runner
      DB_NAME: curl_runner
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Set only to use an external Postgres instead of `db`.
      DATABASE_URL: ${DATABASE_URL:-}
      SECRET_KEY: ${SECRET_KEY:?}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SIGNUP: ${SIGNUP:-}
      DEFAULT_PLAN: ${DEFAULT_PLAN:-}
      SIGNUP_DOMAINS: ${SIGNUP_DOMAINS:-}
      OPERATOR_EMAILS: ${OPERATOR_EMAILS:-}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_MONTHLY: ${STRIPE_PRICE_MONTHLY:-}
      STRIPE_PRICE_ANNUAL: ${STRIPE_PRICE_ANNUAL:-}
    networks:
      # The dashboard calls the API here, on the private network.
      internal:
        aliases:
          - curl-runner-server
      coolify:
    healthcheck:
      test: ["CMD", "/curl-runner-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # The dashboard at cloud.curl-runner.com. It reaches the API on the private
  # network, so the API sees the dashboard as its one trusted proxy hop.
  app:
    image: ghcr.io/alexvcasillas/curl-runner-cloud:${CLOUD_IMAGE_TAG:-latest}
    depends_on:
      server:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://curl-runner-server:8080
      # No defaults: the dashboard would advertise localhost and drop Secure cookies.
      PUBLIC_API_URL: ${PUBLIC_API_URL:?set PUBLIC_API_URL to the API's public URL}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?set PUBLIC_APP_URL to the dashboard's public URL}
      PORT: 3000
    networks:
      - internal
      - coolify
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: curl_runner
      POSTGRES_USER: curl_runner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Private: only the server reaches Postgres. Not on the shared network.
    networks:
      internal:
        aliases:
          - curl-runner-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curl_runner -d curl_runner"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  db-data:

networks:
  internal:
  coolify:
    external: true
