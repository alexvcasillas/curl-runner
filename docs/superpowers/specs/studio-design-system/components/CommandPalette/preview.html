<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CommandPalette — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
</head>
<body>
<div class="cr-stage"><div class="cr-palette cr-float">
<div class="cr-palette-input"><svg class="cr-icon" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg><span>chrg</span></div>
<div style="padding:4px">
<div class="cr-group-label">Requests</div>
<div class="cr-item is-active"><span class="cr-method cr-method-post">POST</span><span class="cr-grow">create-<mark>ch</mark>a<mark>rg</mark>e</span><span class="cr-item-muted">charges</span></div>
<div class="cr-item"><span class="cr-method cr-method-get">GET</span><span class="cr-grow">list-<mark>ch</mark>a<mark>rg</mark>es</span><span class="cr-item-muted">charges</span></div>
<div class="cr-group-label">Actions</div>
<div class="cr-item"><svg class="cr-icon cr-icon-sm" viewBox="0 0 16 16" style="fill:currentColor;stroke:none"><path d="M4 2.5v11l9-5.5z"/></svg><span class="cr-grow">Run collection</span><span class="cr-kbd">⇧⌘↵</span></div>
<div class="cr-item"><span class="cr-grow">Switch environment…</span><span class="cr-kbd">⌘E</span></div>
</div>
<div class="cr-palette-foot"><span><span class="cr-kbd">↑↓</span> to move</span><span><span class="cr-kbd">↵</span> to open</span><span><span class="cr-kbd">Esc</span> to close</span></div>
</div></div>
</body>
</html>
