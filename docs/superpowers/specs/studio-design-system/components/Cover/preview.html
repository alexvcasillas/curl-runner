<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>curl-runner studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&amp;display=swap">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg-100); color:var(--text-primary); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .prim { fill:var(--primary); }
  .blue { fill:var(--accent-blue); }
  .grid { fill:var(--border-200); }
  .ok { fill:var(--success); }
  .warn { fill:var(--warning); }
  .dot { fill:var(--text-gutter); }
  .blk { rx:var(--radius-md); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:64px; line-height:.95; font-weight:600; letter-spacing:-.03em; color:var(--text-primary); }
  .tag { margin:var(--space-3) 0 0 2px; font-size:14px; line-height:20px; color:var(--text-secondary); }
</style>
</head>
<body>
<div class="cover">

<svg viewBox="0 0 480 288" width="480" height="288">

  arrangement flush modular grid like the three-column window: tall slabs, a strip of status bars on one baseline space-6 above the bottom edge, space-4 gutters
  pattern     dot grid, from "Dense and calm… 4px scale, mono for what gets sent": 54 text-gutter dots at a space-6 pitch over the border-200 slab, like an editor gutter
  scales      gutters space-4; pitch space-6; bottoms on one line space-6 up; corners radius-md
-->
