<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toast — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
</head>
<body>
<div class="cr-col">
<div class="cr-toast cr-float"><svg class="cr-icon cr-icon-sm is-success" viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7"/></svg><span class="cr-grow">Link copied</span></div>
<div class="cr-toast cr-float"><svg class="cr-icon cr-icon-sm is-danger" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 5v3.5M8 10.75v.5"/></svg><span class="cr-grow">Couldn't reach runner.example.com<span class="cr-sub" style="font-size:12px">Changes stay local until you're back online.</span></span><button type="button" class="cr-btn cr-btn-sm">Retry</button></div>
</div>
</body>
</html>
