<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
</head>
<body>
<div class="cr-col">
<div class="cr-stage" style="padding:0">
<button type="button" class="cr-btn cr-btn-primary"><svg class="cr-icon cr-icon-sm" viewBox="0 0 16 16" style="fill:currentColor;stroke:none"><path d="M4 2.5v11l9-5.5z"/></svg> Run <span class="cr-kbd">⌘↵</span></button>
<button type="button" class="cr-btn">Run collection</button>
<button type="button" class="cr-btn cr-btn-ghost">Cancel</button>
<button type="button" class="cr-btn cr-btn-danger">Delete request</button>
<button type="button" class="cr-btn" disabled title="Fix 2 errors to run"><svg class="cr-icon cr-icon-sm" viewBox="0 0 16 16" style="fill:currentColor;stroke:none"><path d="M4 2.5v11l9-5.5z"/></svg> Run</button>
</div>
<div class="cr-stage" style="padding:0">
<button type="button" class="cr-btn cr-btn-sm">Fix</button>
<button type="button" class="cr-btn cr-btn-sm cr-btn-ghost">Ignore</button>
<button type="button" class="cr-btn cr-btn-icon cr-btn-ghost" aria-label="New request"><svg class="cr-icon" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></button>
</div>
</div>
</body>
</html>
