<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tabs — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
</head>
<body>
<div>
<div class="cr-tabs" role="tablist" aria-label="Open files">
<button type="button" role="tab" aria-selected="true" class="cr-tab"><span class="cr-method cr-method-post" style="width:auto">POST</span> create-charge.yaml</button>
<button type="button" role="tab" aria-selected="false" class="cr-tab"><span class="cr-method cr-method-get" style="width:auto">GET</span> get-charge.yaml <span class="cr-dirty" aria-label="Unsaved"></span></button>
</div>
<div class="cr-tabs cr-tabs-panel" role="tablist" aria-label="Inspector">
<button type="button" role="tab" aria-selected="true" class="cr-tab">Response</button>
<button type="button" role="tab" aria-selected="false" class="cr-tab">Checks <span class="cr-count">4</span></button>
<button type="button" role="tab" aria-selected="false" class="cr-tab">Headers <span class="cr-count">9</span></button>
<button type="button" role="tab" aria-selected="false" class="cr-tab">Timing</button>
</div>
</div>
</body>
</html>
