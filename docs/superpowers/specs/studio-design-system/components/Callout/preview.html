<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Callout — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
</head>
<body>
<div class="cr-col">
<div class="cr-callout cr-callout-info"><svg class="cr-icon cr-icon-sm is-info" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 7.5V11M8 5v.5"/></svg><span class="cr-grow">Values for <code>API_TOKEN</code> stay in your keychain and are never synced.</span></div>
<div class="cr-callout cr-callout-warning"><svg class="cr-icon cr-icon-sm is-warning" viewBox="0 0 16 16"><path d="M8 2l6.5 11.5h-13z"/><path d="M8 6.5v3M8 11.5v.5"/></svg><span class="cr-grow">Unknown key <code>backof</code> in <code>retry</code>. Did you mean <code>backoff</code>?</span><button type="button" class="cr-btn cr-btn-sm">Fix</button></div>
<div class="cr-callout cr-callout-error"><svg class="cr-icon cr-icon-sm is-danger" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 5v3.5M8 10.75v.5"/></svg><span class="cr-grow">Can't run until 2 errors are fixed.<span class="cr-sub">Warnings don't block a run.</span></span><button type="button" class="cr-btn cr-btn-sm">Next error <span class="cr-kbd">F8</span></button></div>
</div>
</body>
</html>
